name: Build Android APK

# Builds the installable debug APK in the cloud.
# Run it from the repo's "Actions" tab (Run workflow), or it runs on every push.
on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install web dependencies
        run: npm install

      - name: Build the Angular web app
        run: npx ng build --configuration production

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Sync web build into the Android project
        run: npx cap sync android

      - name: Build the debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CurrencyConverter-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
